[variables]
main_domain = "${domain}"

[config]
[[config.domains]]
serviceName = "proxy"
port = 80
host = "${main_domain}"
path = "/"

[config.env]
# PostHog has no tagged self-host releases, so every image is pinned to a build
# from the same era (the 2026-07-14 snapshot Dokploy's upstream template runs):
#   POSTHOG_VERSION          = full commit sha, ALSO the git ref init-assets uses
#                              to fetch the matching ClickHouse config
#   POSTHOG_NODE_VERSION     = posthog/posthog-node sha tag (what hobby's `latest` is)
#   CAPTURE/FEATURE_FLAGS/HYPERCACHE_VERSION = ghcr.io/posthog/posthog/<img> sha tags
#   CLICKHOUSE_VERSION       = clickhouse/clickhouse-server tag (see CPU note below)
# Upgrading means re-porting the trimmed stack from upstream's hobby compose
# (newer hobby needs a custom ClickHouse image, SeaweedFS, personhog, ...).
POSTHOG_VERSION = "1e7b36ebe0da38a738fed250d175809a899ef422"
POSTHOG_NODE_VERSION = "sha-82ea668"
CAPTURE_VERSION = "sha-0c41485"
FEATURE_FLAGS_VERSION = "sha-0c41485"
HYPERCACHE_VERSION = "sha-0c41485"
LIVESTREAM_VERSION = "sha-e6a7738"
# ClickHouse >= 26.6 needs x86-64-v3 (AVX2); older CPUs (Ivy Bridge and earlier,
# or VMs that hide AVX2) die with "Illegal instruction". 26.3 is an LTS line that
# still targets SSE4.2 and runs everywhere. Bump to 26.6+ only on AVX2 hosts.
CLICKHOUSE_VERSION = "26.3.66.4"

# Secrets
POSTHOG_SECRET_KEY = "${password:64}"
POSTHOG_ENCRYPTION_SALT_KEYS = "${hash:32}"
POSTGRES_PASSWORD = "${password:32}"
OBJECT_STORAGE_ACCESS_KEY_ID = "${password:16}"
OBJECT_STORAGE_SECRET_ACCESS_KEY = "${password:32}"

# Must match the scheme the BROWSER uses, not the origin's: behind Cloudflare
# (Flexible or Full) or Let's Encrypt that is https, and Django rejects every
# logged-in POST with "CSRF Failed: Origin checking failed" if this says http.
# Only for a plain-http-only domain: set http://<domain> and SECURE_COOKIES=false.
POSTHOG_SITE_URL = "https://${main_domain}"
# Marks session/CSRF cookies Secure; needs https in the browser (see above)
POSTHOG_SECURE_COOKIES = "true"

# General
ALLOWED_HOSTS = "*"
OPT_OUT_CAPTURE = "false"
DISABLE_PAID_FEATURE_SHOWCASING = "false"
SKIP_SERVICE_VERSION_REQUIREMENTS = "false"
ASYNC_EVENT_ACTION_MAPPING = "false"
ACTION_EVENT_MAPPING_INTERVAL_SECONDS = "300"
WAREHOUSE_PERSON_PROPERTIES_ENABLED_SELF_HOSTED = "true"
# Plugin server (Node) log level
LOG_LEVEL = "info"

# Email (also editable later in Instance settings)
EMAIL_ENABLED = "false"
EMAIL_HOST = ""
EMAIL_PORT = "587"
EMAIL_HOST_USER = ""
EMAIL_HOST_PASSWORD = ""
EMAIL_USE_TLS = "true"
EMAIL_USE_SSL = "false"
EMAIL_DEFAULT_FROM = "posthog@${main_domain}"

# Social login (empty = disabled)
SOCIAL_AUTH_GITHUB_KEY = ""
SOCIAL_AUTH_GITHUB_SECRET = ""
SOCIAL_AUTH_GITLAB_API_URL = "https://gitlab.com"
SOCIAL_AUTH_GITLAB_KEY = ""
SOCIAL_AUTH_GITLAB_SECRET = ""
SOCIAL_AUTH_GOOGLE_OAUTH2_KEY = ""
SOCIAL_AUTH_GOOGLE_OAUTH2_SECRET = ""

# PostHog AI features (empty = disabled)
ANTHROPIC_API_KEY = ""
OPENAI_API_KEY = ""
OPENAI_BASE_URL = "https://api.openai.com/v1"
OPENAI_MODEL = "gpt-4.1-mini"

[[config.mounts]]
filePath = "/db-init/create-extra-dbs.sh"
content = """
#!/bin/bash
# Creates the auxiliary databases PostHog services can point at
# (mirrors docker/postgres-init-scripts in the PostHog repo)
set -e
set -u

for db in cyclotron posthog_persons behavioral_cohorts; do
    DB_EXISTS=$(psql -U "$POSTGRES_USER" -tAc "SELECT 1 FROM pg_database WHERE datname='$db'")
    if [ -z "$DB_EXISTS" ]; then
        echo "Creating database '$db'..."
        psql -U "$POSTGRES_USER" -c "CREATE DATABASE $db;"
        psql -U "$POSTGRES_USER" -c "GRANT ALL PRIVILEGES ON DATABASE $db TO $POSTGRES_USER;"
    fi
done
"""

[[config.mounts]]
filePath = "/livestream/configs.yml"
content = """
debug: false
kafka:
    brokers: 'kafka:9092'
    topic: 'events_plugin_ingestion'
    group_id: 'livestream'
    security_protocol: 'PLAINTEXT'
    session_recording_enabled: true
    session_recording_security_protocol: 'PLAINTEXT'
consumers:
    event:
        enabled: true
        brokers: 'kafka:9092'
        topic: 'events_plugin_ingestion'
        security_protocol: 'PLAINTEXT'
        group_id: 'livestream'
    session_recording:
        enabled: true
        brokers: 'kafka:9092'
        topic: 'session_recording_snapshot_item_events'
        security_protocol: 'PLAINTEXT'
        group_id: 'livestream-session-recordings'
    notification:
        enabled: false
mmdb:
    path: 'GeoLite2-City.mmdb'
"""
